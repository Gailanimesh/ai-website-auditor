<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Test UI</title>
    <style>
        body { font-family: monospace; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; font-family: monospace; }
        button { padding: 10px 20px; background: #333; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #555; }
        #terminal { background: #111; color: #00ff00; padding: 15px; height: 400px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; font-size: 14px;}
        .log-msg { margin-bottom: 5px; }
        .log-error { color: #ff4444; }
        .log-result { color: #00ddff; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>FastAPI Backend & WebSocket Tester</h2>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://webscraper.io/test-sites/e-commerce/allinone)">
            <button onclick="startTest()">Run Audit Test</button>
        </div>
        <div id="terminal"></div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');

        function logToTerminal(message, type = 'msg') {
            const el = document.createElement('div');
            el.className = `log-${type}`;
            el.textContent = message;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function startTest() {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert("Please enter a URL");

            terminal.innerHTML = '';
            logToTerminal(`[SYSTEM] Connecting to ws://localhost:8000/ws/audit...`);

            const ws = new WebSocket('ws://localhost:8000/ws/audit');

            ws.onopen = () => {
                logToTerminal(`[SYSTEM] Connected successfully! Sending URL: ${url}`);
                ws.send(url);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.error) {
                    logToTerminal(`[ERROR] ${data.error}`, 'error');
                } 
                if (data.log) {
                    logToTerminal(`[BACKEND] ${data.log}`);
                } 
                if (data.result) {
                    logToTerminal(`[RESULT_JSON_DUMP]\n${JSON.stringify(data.result, null, 2)}`, 'result');
                }
            };

            ws.onerror = () => {
                logToTerminal(`[ERROR] WebSocket connection failed. Is the Uvicorn server running?`, 'error');
            };

            ws.onclose = () => {
                logToTerminal(`[SYSTEM] Connection closed.`);
            };
        }
    </script>
</body>
</html>
